<a class="skip-link" href="#workspace">Skip to workspace</a>
<header class="app-header no-print">
  <h1 class="visually-hidden">LocalResume</h1>
  <div class="header-actions">
    <app-ai-lozenge (openSettings)="aiSettingsOpen.set(true)" />
    <div class="header-controls">
      @if (ext.isExtension()) {
        <button app-button type="button" variant="secondary" size="sm" (click)="ext.openInNewTab()" title="Open ATS Resume Builder in a full browser tab">
          Full tab
        </button>
      }
      <app-theme-toggle />
    </div>
  </div>
</header>

@if (!vs.onboarded()) {
  <app-onboarding />
} @else {
  <nav class="tabs no-print" aria-label="Workspace steps">
    @for (t of tabs; track t.id) {
      <button
        type="button"
        [class.active]="tab() === t.id"
        [attr.aria-current]="tab() === t.id ? 'step' : null"
        (click)="layout.setActiveTab(t.id)"
      >
        {{ t.label }}
      </button>
    }
  </nav>
  <main
    id="workspace"
    class="workspace"
    [class.vault-collapsed]="layout.vaultCollapsed()"
    [class.triage-collapsed]="layout.triageCollapsed()"
    [attr.data-tab]="tab()"
  >
    <section class="panel panel-vault no-print" [class.collapsed]="layout.vaultCollapsed()" aria-label="Master career vault">
      <div class="vault-rail">
        <button
          app-button
          type="button"
          variant="secondary"
          size="sm"
          [iconOnly]="true"
          [iconLeading]="expandIcon"
          aria-label="Expand master career vault"
          [attr.aria-expanded]="false"
          (click)="layout.setVaultCollapsed(false)"
        ></button>
        <span class="vault-rail__label">Master Career Vault</span>
      </div>
      <app-vault-editor />
    </section>
    <section class="panel panel-triage no-print" [class.collapsed]="layout.triageCollapsed()" aria-label="Job description and AI triage">
      <div class="vault-rail triage-rail">
        <button
          app-button
          type="button"
          variant="secondary"
          size="sm"
          [iconOnly]="true"
          [iconLeading]="expandIcon"
          aria-label="Expand job description and AI triage"
          [attr.aria-expanded]="false"
          (click)="layout.setTriageCollapsed(false)"
        ></button>
        <span class="vault-rail__label">Job Match &amp; Triage</span>
      </div>
      <app-triage />
    </section>
    <section class="panel panel-preview" aria-label="A4 preview">
      <app-preview />
    </section>
  </main>
}

@if (aiSettingsOpen()) {
  <app-modal title="AI Engine &amp; Local Model Settings" (closed)="aiSettingsOpen.set(false)">
    <app-ai-settings #aiSettings />
    <div class="row" style="justify-content: flex-end; margin-top: 12px;">
      <button app-button type="button" variant="ghost" (click)="aiSettingsOpen.set(false)">Cancel</button>
      <button app-button type="button" variant="primary" (click)="aiSettings.saveAndClose(closeAiSettings)">Save settings</button>
    </div>
  </app-modal>
}
