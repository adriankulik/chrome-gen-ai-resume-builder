@if (loading) {
  <svg
    lucideIcon
    [lucideIcon]="spinnerIcon"
    [size]="iconPx"
    class="app-button__icon app-button__icon--lead app-button__icon--spin"
  ></svg>
} @else if (iconLeading) {
  <svg
    lucideIcon
    [lucideIcon]="iconLeading"
    [size]="iconPx"
    class="app-button__icon app-button__icon--lead"
  ></svg>
}
@if (!iconOnly) {
  <span class="app-button__label">
    @if (loading) {
      {{ currentLoadingMessage() }}
    } @else {
      <ng-content></ng-content>
    }
  </span>
}
@if (iconTrailing && !loading) {
  <svg
    lucideIcon
    [lucideIcon]="iconTrailing"
    [size]="iconPx"
    class="app-button__icon app-button__icon--trail"
  ></svg>
}
